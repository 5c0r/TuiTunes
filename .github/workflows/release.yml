name: Release

# Publication consumes the artifacts of a successful CI run for a trusted push
# to main in this repository — the exact bytes the maintainer reviewed during
# attended macOS/WSLg acceptance. The helper is never rebuilt here.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
  id-token: write

# Queued candidates serialize; a live publication is never cancelled mid-flight.
concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    # Fork/PR-sourced and unsuccessful CI runs are rejected outright.
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    # The required maintainer reviewer is configured EXTERNALLY on this GitHub
    # environment (Settings → Environments → native-audio-release). The YAML
    # name alone is not the gate: scripts/check-native-release.ts fail-closed
    # verifies that required-reviewer protection actually exists before
    # semantic-release may publish.
    environment:
      name: native-audio-release
    steps:
      - name: Record candidate identity
        run: echo "CANDIDATE_SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Reject stale or superseded candidates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$CANDIDATE_SHA" ]; then
            echo "candidate $CANDIDATE_SHA is not the current origin/main tip; refusing to publish a superseded candidate" >&2
            exit 1
          fi

      - name: Download native artifacts from this exact CI run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: artifacts
          pattern: tui-tunes-darwin-*
          merge-multiple: true

      - name: Download helper artifact from this exact CI run
        uses: actions/download-artifact@v4
        with:
          name: tuitunes-spectrum-helper
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: artifacts
          merge-multiple: true

      - name: List downloaded candidate artifacts
        run: ls -l artifacts

      - name: Fail-closed prepublish verification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun scripts/check-native-release.ts \
            --expected-sha "$CANDIDATE_SHA" \
            --run-id "${{ github.event.workflow_run.id }}" \
            --repo "${{ github.repository }}" \
            --artifacts artifacts

      - name: Stage the verified helper for npm packaging (no rebuild)
        run: |
          set -euo pipefail
          tar -xzf artifacts/tuitunes-spectrum-helper.tar.gz -C .
          test -f native/bin/TuiTunesSpectrum.app/Contents/Info.plist
          test -x native/bin/TuiTunesSpectrum.app/Contents/MacOS/tuitunes-spectrum-tap

      - name: Recheck the candidate is still the main tip before publishing
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$CANDIDATE_SHA" ]; then
            echo "main advanced beyond $CANDIDATE_SHA after approval; a newer CI candidate exists — publication aborted" >&2
            exit 1
          fi

      - name: Configure push access for the changelog commit
        run: git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
